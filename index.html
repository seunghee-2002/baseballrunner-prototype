<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Baseball Action Runner — Prototype</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage">
  <canvas id="gl"></canvas>

  <!-- 4분할 대응 영역 (§8) : 버튼 그래픽이 아니라 화면 영역 그 자체가 입력이다 -->
  <div id="zones">
    <div class="zone" data-zone="LT"><span class="zone-arrow">&#8598;</span></div>
    <div class="zone" data-zone="RT"><span class="zone-arrow">&#8599;</span></div>
    <div class="zone" data-zone="LB"><span class="zone-arrow">&#8601;</span></div>
    <div class="zone" data-zone="RB"><span class="zone-arrow">&#8600;</span></div>
  </div>

  <!-- HUD (§22, §23) -->
  <div id="hud">
    <div class="hud-top">
      <div id="score">SCORE 0</div>
      <div id="outs">OUT <i></i><i></i><i></i></div>
    </div>
    <div id="chance">READY</div>
    <div id="gaugeWrap">
      <div id="gaugeFill"></div>
      <div id="gaugeEdge"></div>
    </div>
    <div id="gaugeHint">RUN GAUGE</div>
    <div id="baseTrack"></div>
    <div id="progress"></div>
    <div id="combo"></div>
    <div id="stageInfo">AT BAT 1 &middot; Lv.1</div>
  </div>

  <div id="flash"></div>
  <div id="callout"></div>
  <div id="subCallout"></div>
  <div id="hintLayer"></div>

  <div id="overlay"></div>

  <div id="loadError" hidden>
    three.js 를 불러오지 못했습니다.<br>인터넷 연결을 확인한 뒤 새로고침하세요.
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/scene.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
